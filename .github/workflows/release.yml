name: release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string
      commit:
        description: Commit named by the release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  licenses:
    name: third-party-licenses
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tagged source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-licenses
          save-if: false
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-about@0.9.1
          fallback: none
      - name: Fetch locked dependency sources
        run: cargo fetch --locked
      - name: Generate third-party license report
        run: cargo about generate --workspace --locked --offline --fail about.hbs -o THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nopal-third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error

  build:
    name: build-${{ matrix.target }}
    needs: licenses
    permissions:
      contents: read
    # npm selects transitive native optional packages from the host OS, so each
    # complete Pi closure identity is measured on its target platform rather
    # than inferred from a cross-platform installation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            node_archive: node-v22.22.0-darwin-arm64.tar.gz
            node_archive_sha256: 5ed4db0fcf1eaf84d91ad12462631d73bf4576c1377e192d222e48026a902640
            pi_runtime_integrity: sha256:1849e5f3271e6386319323a9e0dbf0f171c6d22558c5e9c05717a20b116915e8
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            node_archive: node-v22.22.0-darwin-x64.tar.gz
            node_archive_sha256: 5ea50c9d6dea3dfa3abb66b2656f7a4e1c8cef23432b558d45fb538c7b5dedce
            pi_runtime_integrity: sha256:2a49edc0cbfae11a095051da5d6d79cd994c85c555ee4f24c74ec3700ef34b4e
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node_archive: node-v22.22.0-linux-x64.tar.gz
            node_archive_sha256: c33c39ed9c80deddde77c960d00119918b9e352426fd604ba41638d6526a4744
            pi_runtime_integrity: sha256:1b7f4f85e0f36eafd10f3db15a6d4ba58087cf10e96ec3cee2e0d5bd00c5e2c1
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tagged commit
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          tagged_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          if [ "$commit" != "$EXPECTED_COMMIT" ] || [ "$tagged_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release source resolved to $commit and tag to $tagged_commit, expected $EXPECTED_COMMIT" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - name: Stage official Node 22.22.0
        env:
          NODE_ARCHIVE: ${{ matrix.node_archive }}
          NODE_ARCHIVE_SHA256: ${{ matrix.node_archive_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            "https://nodejs.org/download/release/v22.22.0/$NODE_ARCHIVE" \
            --output "/tmp/$NODE_ARCHIVE"
          echo "$NODE_ARCHIVE_SHA256  /tmp/$NODE_ARCHIVE" | shasum -a 256 --check
          mkdir -p _runtime/node-source _runtime
          tar -xzf "/tmp/$NODE_ARCHIVE" -C _runtime/node-source --strip-components=1
          cp _runtime/node-source/bin/node _runtime/node
          cp _runtime/node-source/LICENSE _runtime/node-LICENSE
          chmod 0755 _runtime/node
      - name: Stage exact Pi 0.80.6 closure
        env:
          PI_RUNTIME_INTEGRITY: ${{ matrix.pi_runtime_integrity }}
        run: |
          npm_cli=_runtime/node-source/lib/node_modules/npm/bin/npm-cli.js
          _runtime/node "$npm_cli" install \
            --global \
            --prefix "$PWD/_runtime/pi-prefix" \
            --ignore-scripts \
            --audit=false \
            --fund=false \
            --update-notifier=false \
            @earendil-works/pi-coding-agent@0.80.6
          mv _runtime/pi-prefix/lib/node_modules/@earendil-works/pi-coding-agent _runtime/pi
          scripts/verify-runtime-integrity.sh \
            "staged Pi ${{ matrix.target }} runtime" \
            _runtime/pi \
            "$PI_RUNTIME_INTEGRITY" \
            >/dev/null
      - name: Build release binary
        env:
          NOPAL_BUILD_COMMIT: ${{ steps.source.outputs.commit }}
        run: cargo build --locked --release -p nopal-cli --target "${{ matrix.target }}"
      - name: Verify native runtime identity profile
        run: >-
          cargo test --locked -p nopal-cli --target "${{ matrix.target }}"
          tests::trusted_runtime_profile_is_complete_for_this_release_target -- --exact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nopal-third-party-licenses
      - name: Package self-contained distribution
        run: sh scripts/package-release.sh "${{ matrix.target }}" "$RELEASE_TAG"
      - name: Inspect and install packaged distribution
        run: |
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          root=$(tar -tzf "$archive" | head -1 | sed 's:/$::')
          mkdir unpacked installed
          tar -xzf "$archive" -C unpacked
          "unpacked/$root/nopal" info --json > /tmp/nopal-info.json
          jq -e '.kind == "nopal.info/v1" and .ok == true' /tmp/nopal-info.json >/dev/null
          "unpacked/$root/install" install "$PWD/installed"
          installed/bin/nopal info --json >/dev/null
          scripts/prove-packaged-launch.sh "$PWD/installed/bin/nopal"
          scripts/check-release-archive.sh "$archive"
      - name: Prove Debian 12 Linux compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" \
            -e RELEASE_TAG="$RELEASE_TAG" \
            -w /workspace \
            debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
            sh -ceu '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 findutils >/dev/null
              archive=/workspace/dist/nopal-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz
              root=$(tar -tzf "$archive" | head -1 | sed "s:/$::")
              mkdir /tmp/nopal-unpacked /tmp/nopal-installed
              tar -xzf "$archive" -C /tmp/nopal-unpacked
              "/tmp/nopal-unpacked/$root/install" install /tmp/nopal-installed
              git config --system url.https://github.com/.insteadOf git://github.com/
              /workspace/scripts/prove-packaged-launch.sh /tmp/nopal-installed/bin/nopal
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nopal-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tagged source before publication
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nopal-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/publish-release.sh "$RELEASE_TAG" dist
