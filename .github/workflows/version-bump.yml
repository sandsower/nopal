name: version-bump

# Every non-release merge to main prepares the next release version in a
# protected pull request. The final v0.2 line advances intentionally to v0.3.0;
# subsequent versions use ordinary patch increments.
# The pull request is refreshed from the latest main, receives an explicit CI
# dispatch, and auto-merges only after the required check succeeds.
# The resulting squash merge is then tagged and passed to release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - name: Configure release Git identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Classify the latest main commit
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: automation/version-bump
        run: |
          git fetch --force --tags origin main
          base_sha=$GITHUB_SHA
          git checkout --detach "$base_sha"

          subject=$(git log -1 --format=%s)
          delays=0
          case "$subject" in
            "chore(release): v"*) delays="0 2 4 8 16" ;;
          esac

          release_pr=
          for delay in $delays; do
            if [ "$delay" -ne 0 ]; then
              sleep "$delay"
            fi
            release_pr=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${base_sha}/pulls" \
              --jq "$(cat scripts/release-pr.jq)")
            if [ -n "$release_pr" ]; then
              break
            fi
          done

          if [ -n "$release_pr" ]; then
            mode=release
          else
            mode=bump
          fi
          {
            echo "base_sha=$base_sha"
            echo "mode=$mode"
            echo "release_pr=$release_pr"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare the version pull request commit
        if: steps.state.outputs.mode == 'bump'
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: automation/version-bump
        run: |
          . scripts/release-version.sh
          git fetch --force origin main
          git switch --force-create "$RELEASE_BRANCH" origin/main
          next=$(release_bump_project_versions Cargo.toml .nopal/bundle.jsonc)
          cargo update --workspace --offline || cargo update --workspace
          verification_dir=$(mktemp -d)
          trap 'rm -rf "$verification_dir"' EXIT HUP INT TERM
          cargo run --locked -p nopal-cli -- --dir . update --write
          cp .nopal/nopal.lock "$verification_dir/nopal.lock"
          cargo run --locked -p nopal-cli -- --dir . update --write
          cmp -s .nopal/nopal.lock "$verification_dir/nopal.lock" || {
            echo "distribution lock regeneration is not deterministic" >&2
            exit 1
          }
          cargo run --locked -p nopal-cli -- --dir . --dry-run --json \
            > "$verification_dir/launch.json"
          jq -e --arg version "$next" '
            .kind == "nopal.launch/v1" and
            .ok == true and
            .bundle.ok == true and
            (.diagnostics | length) == 0 and
            (.bundle.packages | any(
              .id == "nopal" and
              .source_kind == "builtin" and
              .resolved == $version
            ))
          ' "$verification_dir/launch.json" >/dev/null
          cargo run --locked -p nopal-cli -- validate
          git add Cargo.toml Cargo.lock .nopal/bundle.jsonc .nopal/nopal.lock
          git commit -m "chore(release): v$next"

          remote_sha=$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          git push \
            "--force-with-lease=refs/heads/$RELEASE_BRANCH:$remote_sha" \
            origin "HEAD:refs/heads/$RELEASE_BRANCH"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"
      - name: Open or refresh the protected version pull request
        if: steps.state.outputs.mode == 'bump'
        id: version_pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: automation/version-bump
          RELEASE_COMMIT: ${{ steps.bump.outputs.commit }}
          RELEASE_VERSION: ${{ steps.bump.outputs.next }}
        run: |
          pr_number=$(gh pr list \
            --base main \
            --head "$RELEASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          body='Automated release-version update. The final v0.2 line advances to v0.3.0; later versions use patch increments. CI is dispatched explicitly because events created with GITHUB_TOKEN do not recursively start pull-request workflows.'
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): v$RELEASE_VERSION" \
              --body "$body")
            pr_number=${pr_url##*/}
          else
            gh pr edit "$pr_number" \
              --title "chore(release): v$RELEASE_VERSION" \
              --body "$body"
          fi

          gh pr merge "$pr_number" \
            --auto \
            --squash \
            --match-head-commit "$RELEASE_COMMIT"

          ci_url=$(gh workflow run ci.yml --ref "$RELEASE_BRANCH")
          ci_id=${ci_url##*/}
          case "$ci_id" in
            ''|*[!0-9]*)
              echo "CI dispatch did not return a workflow run URL: $ci_url" >&2
              exit 1
              ;;
          esac

          ci_state=failure
          if gh run watch "$ci_id" --exit-status; then
            ci_state=success
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_COMMIT}" \
            -f state="$ci_state" \
            -f context=checks \
            -f description="Exact dispatched CI $ci_state" \
            -f target_url="$ci_url" \
            >/dev/null

          action_required_runs=$(gh run list \
            --workflow ci.yml \
            --branch "$RELEASE_BRANCH" \
            --event pull_request \
            --limit 20 \
            --json databaseId,headSha,conclusion \
            --jq 'map(select(.headSha == env.RELEASE_COMMIT and .conclusion == "action_required")) | .[].databaseId')
          for run_id in $action_required_runs; do
            gh run delete "$run_id"
          done

          if [ "$ci_state" != success ]; then
            exit 1
          fi

          release_commit=
          for delay in 0 2 4 8 16 32; do
            if [ "$delay" -ne 0 ]; then
              sleep "$delay"
            fi
            pr_state=$(gh pr view "$pr_number" \
              --json headRefOid,mergeCommit,state)
            current_head=$(printf '%s\n' "$pr_state" | jq -r '.headRefOid')
            if [ "$current_head" != "$RELEASE_COMMIT" ]; then
              echo "release pull request head changed to $current_head" >&2
              exit 1
            fi
            if [ "$(printf '%s\n' "$pr_state" | jq -r '.state')" = MERGED ]; then
              release_commit=$(printf '%s\n' "$pr_state" | jq -r '.mergeCommit.oid')
              break
            fi
          done
          if [ -z "$release_commit" ] || [ "$release_commit" = null ]; then
            echo "release pull request did not merge after exact CI succeeded" >&2
            exit 1
          fi
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
      - name: Tag the protected release commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_RELEASE_COMMIT: ${{ steps.version_pr.outputs.release_commit }}
          RELEASE_MODE: ${{ steps.state.outputs.mode }}
        run: |
          case "$RELEASE_MODE" in
            bump) commit=$MERGED_RELEASE_COMMIT ;;
            release) commit=${{ steps.state.outputs.base_sha }} ;;
            *)
              echo "unknown release mode: $RELEASE_MODE" >&2
              exit 1
              ;;
          esac
          if [ -z "$commit" ]; then
            echo "protected release commit was not selected" >&2
            exit 1
          fi

          git fetch --force --tags origin main
          git checkout --detach "$commit"
          . scripts/release-version.sh
          version=$(release_workspace_version Cargo.toml)
          tag="v$version"
          release_validate_tag Cargo.toml "$tag" >/dev/null
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            tagged_commit=$(git rev-parse "refs/tags/$tag^{}")
            if [ "$tagged_commit" != "$commit" ]; then
              echo "$tag already names $tagged_commit" >&2
              exit 1
            fi
          else
            git tag -a "$tag" -m "$tag" "$commit"
            git push origin "refs/tags/$tag"
          fi
          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: coordinate
    if: needs.coordinate.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.coordinate.outputs.tag }}
      commit: ${{ needs.coordinate.outputs.commit }}
