[workspace]
resolver = "3"
members = [
    "crates/nopal-ledger-json",
    "crates/nopal-core",
    "crates/nopal-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sandsower/nopal"

[workspace.dependencies]
nopal-core = { path = "crates/nopal-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
jsonc-parser = { version = "0.26", features = ["serde"] }
globset = "0.4"
regex = "1"
toml = "0.9"
serde_yaml_ng = "0.10"
getrandom = "0.3"
fs2 = "0.4"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
tempfile = "3"
url = "2"
same-file = "1"
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
