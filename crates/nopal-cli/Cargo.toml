serde = { workspace = true }
serde_json = { workspace = true }
nopal-ledger-json = { path = "../nopal-ledger-json" }
nopal-field = { path = "../nopal-field" }
nopal-feed-client = { path = "../nopal-feed-client" }
nopal-rondo-client = { workspace = true }
nopal-rondo-lifecycle = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
fs2 = { workspace = true }
libc = { workspace = true }
jsonc-parser = { workspace = true }

[dev-dependencies]
nopal-native-lifecycle = { workspace = true }

[lints]
workspace = true
