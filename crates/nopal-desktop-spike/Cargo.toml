[package]
name = "nopal-desktop-spike"
description = "Disposable native desktop feasibility spike for the Nopal Field"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nopal-field-native"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
async-channel = "2"
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "=0.35.0", default-features = false, features = ["default_fonts"] }
libc = "0.2"
nopal-feed-client = { path = "../nopal-feed-client" }
nopal-field-presentation = { workspace = true }
nopal-native-lifecycle = { workspace = true }
serde_json = { workspace = true }
signal-hook = "0.4"
socket2 = "0.6"
unicode-width = "0.2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nopal-core = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
