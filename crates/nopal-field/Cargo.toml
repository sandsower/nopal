# Apache-2.0 embedded VT engine for the flagship embedded-seat panel.
# The Herdr technique is ported, not its source.
alacritty_terminal = "0.26"
# OSC 52 clipboard payloads; already in the tree via alacritty_terminal.
base64 = "0.22"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
