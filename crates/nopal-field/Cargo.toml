[package]
name = "nopal-field"
description = "Nopal Field: architecture-B coordination surface - ratatui sidebar inside tmux, real-pane seats, control-mode sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nopal-feed-client = { path = "../nopal-feed-client" }
