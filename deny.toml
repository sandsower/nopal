[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is used only by wayland-scanner at build time over trusted protocol XML; remove when wayland-scanner supports quick-xml 0.41 or newer" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is used only by wayland-scanner at build time over trusted protocol XML; remove when wayland-scanner supports quick-xml 0.41 or newer" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
